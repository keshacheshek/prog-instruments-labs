name: Lab 6 Tests

on:
  push:
    branches: [ lab_6 ]
  pull_request:
    branches: [ lab_6 ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install pytest

    - name: Create test files
      run: |
        # Создаем необходимые файлы для тестов
        echo "0101010101" > cpp_seq.txt
        echo "111000111000" > java_seq.txt

    - name: Run tests
      run: |
        echo "Запуск тестов..."
        python -m pytest tests/ -v

    - name: Check coverage
      run: |
        echo "Проверка покрытия..."
        python -m coverage run -m pytest tests/
        python -m coverage report