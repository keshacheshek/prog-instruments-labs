name: Lab 6 Tests

on:
  push:
    branches: [ lab_6 ]
  pull_request:
    branches: [ lab_6 ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install pytest

    - name: Run tests
      run: |
        echo "Текущая директория: $(pwd)"
        echo "Содержимое:"
        ls -la
        
        # Проверяем структуру проекта
        if [ -d "lab_6" ]; then
          echo "Переходим в lab_6"
          cd lab_6
          echo "Содержимое lab_6:"
          ls -la
        fi
        
        # Создаем необходимые файлы для тестов
        echo "0101010101" > cpp_seq.txt
        echo "111000111000" > java_seq.txt
        
        echo "Запуск тестов..."
        python -m pytest tests.py -v
        
        echo "Проверка покрытия..."
        python -m pytest tests.py --cov=main --cov-report=term-missing