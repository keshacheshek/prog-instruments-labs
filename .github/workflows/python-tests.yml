name: Lab 6 Tests

on:
  push:
    branches: [ lab_6 ]
  pull_request:
    branches: [ lab_6 ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install pytest scipy

    # ПРЯМОЙ ЗАПУСК БЕЗ ЛИШНИХ ПРОВЕРОК
    - name: Run tests directly
      run: |
        echo "Запуск тестов..."
        
        # Переходим в папку lab_6
        cd lab_6
        
        # Создаем необходимые файлы
        echo "0101010101" > cpp_seq.txt
        echo "111000111000" > java_seq.txt
        
        # Запускаем тесты ПРЯМО через Python
        python -c "
import sys
import os
import pytest

# Добавляем текущую папку в путь
sys.path.insert(0, os.getcwd())

# Проверяем, что файл существует
if not os.path.exists('tests.py'):
    print('❌ Файл tests.py не найден')
    sys.exit(1)

# Загружаем тестовый модуль
print('Импортируем tests.py...')
exec(open('tests.py').read())

# Запускаем pytest
print('Запускаем тесты...')
sys.exit(pytest.main(['-v', 'tests.py']))
        "