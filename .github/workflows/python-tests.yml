name: Python Tests

on:
  push:
    branches: [ lab_6 ]
  pull_request:
    branches: [ lab_6 ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install pytest scipy

    - name: Run tests
      run: |
        pytest tests.py -v